<title>45 Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFEA; --panel:#FFFFFF; --ink:#13241A; --muted:#5A6D61; --line:#CFDAD2; --accent:#1C6A43; --accent-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1913; --panel:#17261D; --ink:#E5EFE8; --muted:#97AE9F; --line:#2A3D31; --accent:#58C389; --accent-ink:#0E1913; }
}
:root[data-theme="dark"]{ --bg:#0E1913; --panel:#17261D; --ink:#E5EFE8; --muted:#97AE9F; --line:#2A3D31; --accent:#58C389; --accent-ink:#0E1913; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.bar{display:flex;align-items:center;gap:6px;padding:8px max(10px,env(safe-area-inset-left,0px)) 8px max(10px,env(safe-area-inset-right,0px));overflow-x:auto;flex:none}
.bar h1{font-size:17px;font-weight:700;margin:0 8px 0 2px;white-space:nowrap;letter-spacing:.02em}
.bar .sp{flex:1;min-width:4px}
body.playing .bar>*:not(h1){opacity:.35;pointer-events:none}
body.locked .bar>*:not(h1):not(#bLock):not(.sp){display:none}
#bLock{position:relative;overflow:hidden}
#bLock .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);opacity:.3;pointer-events:none}
#bLock.holding .fill{width:100%;transition:width .8s linear}
#bFull[hidden]{display:none}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:40px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;background:transparent;min-height:38px;padding:0 12px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{flex:1;min-height:0;position:relative;padding:0 max(6px,env(safe-area-inset-left,0px)) 6px max(6px,env(safe-area-inset-right,0px))}
svg#board{width:100%;height:100%;display:block;touch-action:none}
body.pen svg#board{cursor:crosshair}
body.erase svg#board{cursor:cell}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;text-anchor:middle;pointer-events:none}
.nm{font-weight:700;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#123A24;stroke-width:.5px;stroke-linejoin:round;pointer-events:none}
body.move .tok, body.move #ball{cursor:grab}
.float{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(10,30,18,.22);max-width:calc(100% - 20px);overflow-x:auto}
.float[hidden]{display:none}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:38px;padding:0 10px;min-width:0}
#insp .n{width:58px;text-align:center}
#insp .m{width:150px}
.ib{border:0;background:transparent;font-size:20px;width:36px;height:36px;border-radius:8px;color:var(--muted);flex:none}
.pc{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);flex:none}
.pc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.vsep{width:1px;align-self:stretch;background:var(--line);flex:none}
.plabel{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;min-width:54px;text-align:center;flex:none}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 20px));top:calc(env(safe-area-inset-top,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin:auto;max-height:min(760px,calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 32px))}
dialog::backdrop{background:rgba(6,18,11,.45)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.dh h2{font-size:18px;margin:0}
.db{padding:6px 16px 18px;overflow:auto;max-height:calc(min(760px,calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 32px)) - 60px)}
.db h3{font-size:15px;margin:22px 0 4px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs .btn{flex:1;justify-content:center}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row label{width:96px;flex:none;font-size:14px;color:var(--muted)}
.row .grow{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.step{display:flex;align-items:center;gap:6px}
.step output{min-width:34px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}
.roster{display:grid;grid-template-columns:64px 1fr;gap:6px;margin-top:6px}
.roster input.n{text-align:center}
.hint{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.scenes{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.scenes li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px}
.scenes .no{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;width:26px;text-align:center;color:var(--muted);flex:none}
.scenes .open{flex:1;min-width:0;border:0;background:transparent;text-align:left;min-height:38px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:700}
.scenes .sb{min-height:36px;padding:0 9px;font-size:13px}
.empty{color:var(--muted);font-size:14px;margin-top:12px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100vw - 24px)}
.toast[hidden]{display:none}
@media (max-width:620px){.bar h1{display:none}.btn,.seg button{padding:0 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html:lang(zh-Hans) body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
html:lang(zh-Hant) body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
html:lang(en) body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
a.btn{color:var(--ink)}a.btn.primary{color:var(--accent-ink)}
.bgopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgopt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.25;text-align:center}
.bgopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bgopt>span{display:block;width:100%;aspect-ratio:105/68;border-radius:5px;border:1px solid var(--line);background-size:cover;background-position:center}
.sw-stripes{background:repeating-linear-gradient(90deg,#2E8250 0 10%,#2A7849 10% 20%)}
.sw-plain{background:#fff}
.sw-lanes5{background:linear-gradient(180deg,#5B8FD6 0 20%,#9AA94E 20% 36%,#2B7A4B 36% 64%,#9AA94E 64% 80%,#5B8FD6 80%)}
.sw-lanes3{background:linear-gradient(180deg,#5B8FD6 0 33.3%,#2B7A4B 33.3% 66.6%,#5B8FD6 66.6%)}
.sw-zones{background:repeating-conic-gradient(#3A9460 0 25%,#246A41 0 50%) 0 0/33.34% 40%}
.sw-photo{background:#C9D3CC repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.5) 6px 12px)}
</style>

<body class="move">
<div class="bar" role="toolbar" data-i18n-aria="toolbar">
  <h1>45 Tactics</h1>
  <button class="btn" id="bAbout" data-i18n-aria="about">ⓘ</button>
  <button class="btn" id="bSettings" data-i18n="settings"></button>
  <div class="seg" role="group" data-i18n-aria="tools">
    <button data-mode="move" aria-pressed="true" data-i18n="move"></button>
    <button data-mode="pen" aria-pressed="false" data-i18n="pen"></button>
    <button data-mode="erase" aria-pressed="false" data-i18n="erase"></button>
  </div>
  <button class="btn" id="bUndo" disabled data-i18n="undo"></button>
  <button class="btn" id="bNames" aria-pressed="true" data-i18n="names"></button>
  <button class="btn" id="bAway" aria-pressed="false" data-i18n="hideAway"></button>
  <button class="btn" id="bFace" data-i18n="faceBall"></button>
  <span class="sp"></span>
  <button class="btn" id="bPlay" disabled data-i18n="play"></button>
  <button class="btn" id="bScenes" data-i18n="scenes"></button>
  <button class="btn" id="bFull" hidden></button>
  <button class="btn" id="bLock" aria-pressed="false"><span class="fill"></span><span id="lockTxt"></span></button>
</div>
<div class="wrap" id="wrap">
  <svg id="board" xmlns="http://www.w3.org/2000/svg" data-i18n-aria="pitchAria">
    <g id="rot">
      <g id="pitch"></g>
      <g id="drawL"></g>
      <g id="tokens"></g>
      <g id="ballL"></g>
      <g id="selL"></g>
    </g>
  </svg>

  <div class="float" id="insp" hidden>
    <span class="dot" id="iDot"></span>
    <input class="n" id="iNum" inputmode="numeric" data-i18n-aria="number" maxlength="3">
    <input class="m" id="iName" data-i18n-ph="name" data-i18n-aria="name" maxlength="14">
    <button class="ib" id="iClose" data-i18n-aria="close">×</button>
  </div>

  <div class="float" id="penBar" hidden>
    <div class="seg" role="group" data-i18n-aria="lineKind">
      <button data-kind="run" aria-pressed="true" data-i18n="run"></button>
      <button data-kind="pass" aria-pressed="false" data-i18n="pass"></button>
    </div>
    <span class="vsep"></span>
    <span id="penColors" style="display:flex;gap:8px"></span>
    <span class="vsep"></span>
    <button class="btn" id="bClearDraw" data-i18n="clearLines"></button>
  </div>

  <div class="float" id="playBar" hidden>
    <button class="btn" id="pRestart" data-i18n="restart"></button>
    <span class="plabel" id="pLabel">1 / 1</span>
    <button class="btn" id="pSpeed"></button>
    <button class="btn primary" id="pStop" data-i18n="stop"></button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<dialog id="dAbout">
  <div class="dh"><h2>45 Tactics <small style="font-weight:500;color:var(--muted);font-size:13px" data-i18n="title"></small><br><small style="font-weight:500;color:var(--muted);font-size:13px">by 45 Tools</small></h2><button class="ib" data-close data-i18n-aria="close">×</button></div>
  <div class="db">
    <p class="hint" style="margin-top:0;font-size:14px;color:var(--ink)" data-i18n="aboutText"></p>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:8px;margin-top:16px">
      <a class="btn" id="aGuide" target="_blank" rel="noopener" style="justify-content:center;text-decoration:none"></a>
      <a class="btn primary" id="aSupport" target="_blank" rel="noopener" style="justify-content:center;text-decoration:none"></a>
    </div>
    <p class="hint" data-i18n="supportNote"></p>
    <div class="row" style="margin-top:16px"><label for="langA" data-i18n="language"></label><select id="langA" class="grow langSel"></select></div>
  </div>
</dialog>

<dialog id="dSet">
  <div class="dh"><h2 data-i18n="settings"></h2><button class="ib" data-close data-i18n-aria="close">×</button></div>
  <div class="db" id="setBody"></div>
  <input type="file" id="photoIn" accept="image/*" hidden>
</dialog>

<dialog id="dScn">
  <div class="dh"><h2 data-i18n="scenes"></h2><button class="ib" data-close data-i18n-aria="close">×</button></div>
  <div class="db">
    <div class="row"><input class="grow" id="scName" maxlength="30"><button class="btn primary" id="scSave" data-i18n="saveBoard"></button></div>
    <p class="hint" data-i18n="scHint"></p>
    <ul class="scenes" id="scList"></ul>
    <h3 data-i18n="file"></h3>
    <p class="hint" style="margin-top:0" data-i18n="fileHint"></p>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn" id="bExport" data-i18n="export"></button>
      <button class="btn" id="bImport" data-i18n="import"></button>
      <button class="btn" id="bDefault" hidden data-i18n="loadDefault"></button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </div>
</dialog>

function autoForm(n){
  const p=[[.06,.5]],m=n-1; if(m<=0) return p;
  const rows=m<=3?1:m<=7?2:3, base=Math.floor(m/rows), ex=m%rows;
  for(let r=0;r<rows;r++){const k=base+(r<ex?1:0),x=rows==1?.7:.34+r*(.58/(rows-1));
    for(let j=0;j<k;j++) p.push([x,(j+1)/(k+1)]);}
  return p;
}
function formsFor(n){return Object.keys(F[n]||{})}
function applyFormation(ti){
  const t_=S.teams[ti], n=t_.count;
  while(t_.players.length<n){const used=new Set(t_.players.map(p=>+p.num));let k=t_.players.length+1;while(used.has(k))k++;t_.players.push({num:String(k),name:''})}
  t_.players.length=n;
  const pts=(F[n]&&F[n][t_.formation])||autoForm(n);
  t_.players.forEach((p,i)=>{const [fx,fy]=pts[i];
    if(ti==0){p.x=fx*W/2;p.y=fy*H;p.a=0}else{p.x=W-fx*W/2;p.y=H-fy*H;p.a=180}});
}

/* ---------- pitch ---------- */
const LANE5=[0,13.84,24.84,43.16,54.16,H], LANE3=[0,H/3,2*H/3,H], ZCOL=[0,16.5,35,52.5,70,88.5,W];
function drawPitch(){
  const st=S.pitch.style, plain=st=='plain', lc=plain?'#5B6A61':'rgba(255,255,255,.88)';
  const L=`fill="none" stroke="${lc}" stroke-width=".24"`;
  const G='fill="none" stroke="rgba(255,255,255,.6)" stroke-width=".18" stroke-dasharray="1 .8"';
  let s=`<rect x="-4" y="-4" width="${W+8}" height="${H+8}" rx="1.2" fill="${plain?'#FFFFFF':'#24683F'}"/>`;
  if(plain){ /* nothing */ }
  else if(st=='lanes5'||st=='lanes3'){
    const b=st=='lanes5'?LANE5:LANE3, tint=st=='lanes5'
      ?['rgba(90,150,255,.42)','rgba(255,214,70,.36)','','rgba(255,214,70,.36)','rgba(90,150,255,.42)']
      :['rgba(90,150,255,.42)','','rgba(90,150,255,.42)'];
    s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#2B7A4B"/>`;
    for(let i=0;i<b.length-1;i++) if(tint[i]) s+=`<rect x="0" y="${b[i]}" width="${W}" height="${b[i+1]-b[i]}" fill="${tint[i]}"/>`;
    for(let i=1;i<b.length-1;i++) s+=`<line x1="0" y1="${b[i]}" x2="${W}" y2="${b[i]}" ${G}/>`;
  }
  else if(st=='zones'){
    for(let c=0;c<ZCOL.length-1;c++) for(let r=0;r<LANE5.length-1;r++)
      s+=`<rect x="${ZCOL[c]}" y="${LANE5[r]}" width="${ZCOL[c+1]-ZCOL[c]}" height="${LANE5[r+1]-LANE5[r]}" fill="${(c+r)%2?'#246A41':'#3A9460'}"/>`;
    for(let c=1;c<ZCOL.length-1;c++) s+=`<line x1="${ZCOL[c]}" y1="0" x2="${ZCOL[c]}" y2="${H}" ${G}/>`;
    for(let r=1;r<LANE5.length-1;r++) s+=`<line x1="0" y1="${LANE5[r]}" x2="${W}" y2="${LANE5[r]}" ${G}/>`;
  }
  else if(st=='photo'&&photo){
    s+=`<image href="${photo}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/>`;
  }
  else { for(let i=0;i<10;i++) s+=`<rect x="${i*10.5}" y="0" width="10.5" height="${H}" fill="${i%2?'#2A7849':'#2E8250'}"/>`; }
  if(S.pitch.lines!==false){
    const dy=Math.sqrt(9.15*9.15-5.5*5.5);
    s+=`<rect x="0" y="0" width="${W}" height="${H}" ${L}/>
    <line x1="${W/2}" y1="0" x2="${W/2}" y2="${H}" ${L}/>
    <circle cx="${W/2}" cy="${H/2}" r="9.15" ${L}/>
    <circle cx="${W/2}" cy="${H/2}" r=".35" fill="${lc}"/>
    <rect x="0" y="13.84" width="16.5" height="40.32" ${L}/>
    <rect x="${W-16.5}" y="13.84" width="16.5" height="40.32" ${L}/>
    <rect x="0" y="24.84" width="5.5" height="18.32" ${L}/>
    <rect x="${W-5.5}" y="24.84" width="5.5" height="18.32" ${L}/>
    <circle cx="11" cy="34" r=".3" fill="${lc}"/><circle cx="${W-11}" cy="34" r=".3" fill="${lc}"/>
    <path d="M16.5 ${34-dy} A9.15 9.15 0 0 1 16.5 ${34+dy}" ${L}/>
    <path d="M${W-16.5} ${34-dy} A9.15 9.15 0 0 0 ${W-16.5} ${34+dy}" ${L}/>
    <rect x="-1.6" y="30.34" width="1.6" height="7.32" ${L}/>
    <rect x="${W}" y="30.34" width="1.6" height="7.32" ${L}/>
    <path d="M1 0A1 1 0 0 1 0 1M${W-1} 0A1 1 0 0 0 ${W} 1M0 ${H-1}A1 1 0 0 1 1 ${H}M${W} ${H-1}A1 1 0 0 0 ${W-1} ${H}" ${L}/>`;
  }
  $('pitch').innerHTML=s;
}
function inkFor(hex){const c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;return (r*299+g*587+b*114)/1000>160?'#13241A':'#FFFFFF'}

/* ---------- drawings ---------- */
function pathD(p){
  if(p.length<2) return '';
  let d=`M${p[0][0].toFixed(2)} ${p[0][1].toFixed(2)}`;
  if(p.length==2) return d+`L${p[1][0].toFixed(2)} ${p[1][1].toFixed(2)}`;
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;d+=`Q${p[i][0].toFixed(2)} ${p[i][1].toFixed(2)} ${mx.toFixed(2)} ${my.toFixed(2)}`}
  const l=p[p.length-1];return d+`L${l[0].toFixed(2)} ${l[1].toFixed(2)}`;
}
function drawingSVG(d){
  const p=d.pts; if(p.length<2) return '';
  const E=p[p.length-1]; let B=p[0];
  for(let i=p.length-2;i>=0;i--){if(Math.hypot(E[0]-p[i][0],E[1]-p[i][1])>=1.8){B=p[i];break}}
  const a=Math.atan2(E[1]-B[1],E[0]-B[0]), L=1.7, w=.95;
  const bx=E[0]-L*Math.cos(a), by=E[1]-L*Math.sin(a);
  const h=`M${E[0].toFixed(2)} ${E[1].toFixed(2)}L${(bx+w*Math.sin(a)).toFixed(2)} ${(by-w*Math.cos(a)).toFixed(2)}L${(bx-w*Math.sin(a)).toFixed(2)} ${(by+w*Math.cos(a)).toFixed(2)}Z`;
  const dash=d.kind=='pass'?' stroke-dasharray="1.1 .8"':'';
  return `<g><path d="${pathD(p)}" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".85" stroke-linecap="round" stroke-linejoin="round"${dash}/>
    <path d="${pathD(p)}" fill="none" stroke="${d.color}" stroke-width=".48" stroke-linecap="round" stroke-linejoin="round"${dash}/>
    <path d="${h}" fill="${d.color}" stroke="rgba(0,0,0,.25)" stroke-width=".12"/></g>`;
}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let k=l?((px-a[0])*dx+(py-a[1])*dy)/l:0;k=Math.max(0,Math.min(1,k));return Math.hypot(px-a[0]-k*dx,py-a[1]-k*dy)}
function hitDrawing(x,y){
  for(let k=S.drawings.length-1;k>=0;k--){const p=S.drawings[k].pts;
    for(let i=0;i<p.length-1;i++) if(segDist(x,y,p[i],p[i+1])<1.6) return k;}
  return -1;
}

/* ---------- render ---------- */
function render(){
  const cr=vertical?90:0;
  $('drawL').innerHTML=S.drawings.map(drawingSVG).join('')+(drag&&drag.k=='pen'?drawingSVG(drag.d):'');
  let s='';
  S.teams.forEach((tm,ti)=>{ if(!tm.visible) return; const ink=inkFor(tm.color), edge=ink=='#FFFFFF'?'#FFFFFF':'#13241A';
    tm.players.forEach((p,i)=>{
      const nm=S.showNames&&p.name?`<text class="nm" y="${R+2.3}" font-size="1.65">${esc(p.name)}</text>`:'';
      s+=`<g class="tok" data-t="${ti}" data-i="${i}" transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})">
        <circle r="3.6" fill="transparent"/>
        <path transform="rotate(${p.a.toFixed(1)})" d="M${R+.3} -1.15L${R+1.75} 0L${R+.3} 1.15Z" fill="${tm.color}" stroke="${edge}" stroke-width=".18" stroke-linejoin="round"/>
        <circle r="${R}" fill="${tm.color}" stroke="${edge}" stroke-width=".32"/>
        <g transform="rotate(${cr})"><text class="num" y=".72" font-size="2.1" fill="${ink}">${esc(p.num)}</text>${nm}</g>
      </g>`;
    });
  });
  $('tokens').innerHTML=s;
  const b=S.ball;
  $('ballL').innerHTML=`<g id="ball" transform="translate(${b.x.toFixed(2)} ${b.y.toFixed(2)})">
    <circle r="3" fill="transparent"/>
    <circle r="1.2" fill="#fff" stroke="#111" stroke-width=".22"/>
    <path d="M0 -.5L.48 -.15L.3 .4L-.3 .4L-.48 -.15Z" fill="#111"/></g>`;
  let h='';
  if(mode=='move'&&!play&&sel&&S.teams[sel.t]&&S.teams[sel.t].players[sel.i]&&S.teams[sel.t].visible){
    const p=S.teams[sel.t].players[sel.i],rr=5.2,a=p.a*Math.PI/180;
    h=`<g transform="translate(${p.x} ${p.y})" pointer-events="none">
      <circle r="${R+.9}" fill="none" stroke="#FFE14D" stroke-width=".4"/>
      <circle r="${rr}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".18" stroke-dasharray=".7 .6"/>
      <line x1="0" y1="0" x2="${rr*Math.cos(a)}" y2="${rr*Math.sin(a)}" stroke="rgba(255,255,255,.75)" stroke-width=".16"/></g>
      <g data-handle="1" transform="translate(${p.x+rr*Math.cos(a)} ${p.y+rr*Math.sin(a)})" style="cursor:grab">
        <circle r="2.6" fill="transparent"/><circle r="1.05" fill="#FFE14D" stroke="#13241A" stroke-width=".2"/></g>`;
    const tm=S.teams[sel.t];
    $('insp').hidden=false; $('iDot').style.background=tm.color;
    if(document.activeElement!==$('iNum')) $('iNum').value=p.num;
    if(document.activeElement!==$('iName')) $('iName').value=p.name;
  } else { $('insp').hidden=true; sel=null; }
  $('selL').innerHTML=h;
  $('bNames').setAttribute('aria-pressed',S.showNames);
  $('bAway').setAttribute('aria-pressed',!S.teams[1].visible);
  $('bPlay').disabled=S.scenes.length<2;
}

/* ---------- pointer ---------- */
const svg=$('board');
function pt(e){const m=$('rot').getScreenCTM().inverse();const q=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);return {x:q.x,y:q.y}}
const clampX=x=>Math.max(-3,Math.min(W+3,x)), clampY=y=>Math.max(-3,Math.min(H+3,y));
function eraseAt(q){const k=hitDrawing(q.x,q.y);if(k<0)return;if(!drag.moved){drag.moved=true;pushUndo()}S.drawings.splice(k,1);render()}
svg.addEventListener('pointerdown',e=>{
  if(play) return;
  const q=pt(e);
  if(mode=='pen'){drag={k:'pen',d:{kind:pen.kind,color:pen.color,pts:[[clampX(q.x),clampY(q.y)]]}};}
  else if(mode=='erase'){drag={k:'erase',moved:false};eraseAt(q)}
  else{
    const hd=e.target.closest('[data-handle]'), tk=e.target.closest('.tok'), bl=e.target.closest('#ball');
    if(hd&&sel) drag={k:'rot',moved:false};
    else if(bl) drag={k:'ball',q,ox:S.ball.x,oy:S.ball.y,cx:e.clientX,cy:e.clientY,moved:false};
    else if(tk){const ti=+tk.dataset.t,i=+tk.dataset.i,p=S.teams[ti].players[i];drag={k:'p',t:ti,i,q,ox:p.x,oy:p.y,cx:e.clientX,cy:e.clientY,moved:false}}
    else { if(sel){sel=null;render()} return; }
  }
  svg.setPointerCapture(e.pointerId); e.preventDefault();
});
svg.addEventListener('pointermove',e=>{
  if(!drag) return; const q=pt(e);
  if(drag.k=='pen'){const p=drag.d.pts,l=p[p.length-1],x=clampX(q.x),y=clampY(q.y);if(Math.hypot(x-l[0],y-l[1])>.5){p.push([x,y]);render()}return}
  if(drag.k=='erase'){eraseAt(q);return}
  if(drag.k=='rot'){const p=S.teams[sel.t].players[sel.i];
    if(!drag.moved){drag.moved=true;pushUndo()}
    p.a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI; render(); return;}
  if(!drag.moved){ if(Math.hypot(e.clientX-drag.cx,e.clientY-drag.cy)<5) return; drag.moved=true; pushUndo(); }
  const nx=clampX(drag.ox+q.x-drag.q.x), ny=clampY(drag.oy+q.y-drag.q.y);
  if(drag.k=='ball'){S.ball.x=nx;S.ball.y=ny}
  else{const p=S.teams[drag.t].players[drag.i];p.x=nx;p.y=ny}
  render();
});
function endDrag(){
  if(!drag) return;
  if(drag.k=='pen'){const p=drag.d.pts;let len=0;for(let i=1;i<p.length;i++)len+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
    if(len>=2){pushUndo();S.drawings.push(drag.d)}}
  else if(drag.k=='p'&&!drag.moved){ sel=(sel&&sel.t==drag.t&&sel.i==drag.i)?null:{t:drag.t,i:drag.i}; }
  else if(drag.k=='p'&&drag.moved){ sel={t:drag.t,i:drag.i}; }
  drag=null; render(); save();
}
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);

let tab=0;
function renderSettings(){
  const tabs=`<div class="tabs">${S.teams.map((x,i)=>`<button class="btn" data-tab="${i}" aria-pressed="${i==tab}"><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</button>`).join('')}<button class="btn" data-tab="2" aria-pressed="${tab==2}">${t('pitchTab')}</button></div>`;
  if(tab==2){
    const st=S.pitch.style;
    $('setBody').innerHTML=tabs+`
    <h3 style="margin-top:4px">${t('background')}</h3>
    <div class="bgopts">${BG_STYLES.map(k=>`<button class="bgopt" data-bg="${k}" aria-pressed="${k==st}"><span class="sw-${k}"${k=='photo'&&photo?` style="background-image:url(${photo})"`:''}></span>${t('bg_'+k)}</button>`).join('')}</div>
    ${st=='photo'?`<div class="row" style="margin-top:12px"><button class="btn" id="pPick">${photo?t('changePhoto'):t('choosePhoto')}</button></div><p class="hint">${t('photoHint')}</p>`:''}
    <div class="row" style="margin-top:14px"><label>${t('lines')}</label>
      <div class="seg"><button data-lines="1" aria-pressed="${S.pitch.lines!==false}">${t('linesOn')}</button><button data-lines="0" aria-pressed="${S.pitch.lines===false}">${t('linesOff')}</button></div></div>
    <div class="row" style="margin-top:18px"><label for="langS">${t('language')}</label><select id="langS" class="grow">${Object.keys(LANG_NAMES).map(k=>`<option value="${k}" ${k==LANG?'selected':''}>${LANG_NAMES[k]}</option>`).join('')}</select></div>`;
    return;
  }
  const tm=S.teams[tab], forms=formsFor(tm.count);
  $('setBody').innerHTML=tabs+`
  <div class="row"><label for="tName">${t('teamName')}</label><input id="tName" class="grow" value="${esc(tm.name)}" maxlength="16"></div>
  <div class="row"><label>${t('color')}</label><div class="sw">${COLORS.map(c=>`<button data-color="${c}" style="background:${c}" aria-label="${t('color')} ${c}" aria-pressed="${c==tm.color}"></button>`).join('')}</div></div>
  ${tab==1?`<div class="row"><label>${t('visibility')}</label><button class="btn" id="tVis" aria-pressed="${tm.visible}">${tm.visible?t('shown'):t('hiddenS')}</button></div>`:''}
  <div class="row"><label>${t('players')}</label><div class="step"><button class="btn" data-step="-1" aria-label="${t('fewer')}">−</button><output>${tm.count}</output><button class="btn" data-step="1" aria-label="${t('more')}">＋</button></div></div>
  <div class="row"><label for="tForm">${t('formation')}</label>
    <select id="tForm" class="grow">${forms.map(f=>`<option ${f==tm.formation?'selected':''}>${f}</option>`).join('')}<option value="auto" ${forms.includes(tm.formation)?'':'selected'}>${t('auto')}</option></select></div>
  <div class="row"><label></label><button class="btn primary" id="tApply">${t('applyForm')}</button></div>
  <p class="hint">${t('formHint')}</p>
  <div class="roster" style="margin-top:14px"><span class="hint" style="margin:0">${t('number')}</span><span class="hint" style="margin:0">${t('name')}</span>
  ${tm.players.map((p,i)=>`<input class="n" data-num="${i}" value="${esc(p.num)}" inputmode="numeric" maxlength="3" aria-label="${t('number')} ${i+1}"><input data-name="${i}" value="${esc(p.name)}" placeholder="${t('name')}" maxlength="14" aria-label="${t('name')} ${i+1}">`).join('')}</div>`;
}
$('setBody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab!=null){tab=+b.dataset.tab;renderSettings();return}
  if(b.dataset.bg){S.pitch.style=b.dataset.bg;drawPitch();save();renderSettings();if(b.dataset.bg=='photo'&&!photo)$('photoIn').click();return}
  if(b.id=='pPick'){$('photoIn').click();return}
  if(b.dataset.lines!=null){S.pitch.lines=b.dataset.lines=='1';drawPitch();save();renderSettings();return}
  const tm=S.teams[tab];
  if(b.dataset.color){tm.color=b.dataset.color;renderSettings();render();save();return}
  if(b.id=='tVis'){tm.visible=!tm.visible;renderSettings();render();save();return}
  if(b.dataset.step){const n=Math.max(1,Math.min(11,tm.count+ +b.dataset.step));if(n==tm.count)return;pushUndo();tm.count=n;
    const f=formsFor(n);if(!f.includes(tm.formation))tm.formation=f[0]||'auto';applyFormation(tab);sel=null;renderSettings();render();save();return}
  if(b.id=='tApply'){pushUndo();applyFormation(tab);sel=null;render();save();$('dSet').close();return}
});
$('setBody').addEventListener('input',e=>{
  const el=e.target; if(tab==2) return; const tm=S.teams[tab];
  if(el.id=='tName'){tm.name=el.value;save();return}
  if(el.dataset.num!=null){tm.players[+el.dataset.num].num=el.value;render();save()}
  if(el.dataset.name!=null){tm.players[+el.dataset.name].name=el.value;render();save()}
});
$('setBody').addEventListener('change',e=>{
  if(e.target.id=='langS'){setLang(e.target.value);return}
  if(e.target.id=='tForm'){pushUndo();S.teams[tab].formation=e.target.value;applyFormation(tab);sel=null;render();save()}
  if(e.target.id=='tName') renderSettings();
});
$('bSettings').onclick=()=>{renderSettings();$('dSet').showModal()};

/* ---------- photo background ---------- */
$('photoIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    const M=1600, k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    photo=c.toDataURL('image/jpeg',.82);
    try{localStorage.setItem(PHOTO_KEY,photo)}catch(err){toast(t('photoBig'))}
    S.pitch.style='photo'; save(); drawPitch(); if($('dSet').open) renderSettings();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast(t('photoErr'))};
  img.src=url;
});

/* ---------- scenes ---------- */
function renderScenes(){
  const l=S.scenes;
  $('scList').innerHTML=l.length?l.map((s,i)=>`<li><span class="no">${i+1}</span>
    <button class="open" data-open="${i}" title="${t('openScene')}">${esc(s.name)}</button>
    <button class="btn sb" data-up="${i}" ${i?'':'disabled'} aria-label="${t('moveUp')}">↑</button>
    <button class="btn sb" data-over="${i}">${t('overwrite')}</button>
    <button class="btn sb" data-del="${i}">${t('del')}</button></li>`).join('')
    :`<li class="empty" style="border:0;padding:0">${t('empty')}</li>`;
  $('scName').value='';$('scName').placeholder=t('sceneN',{n:l.length+1});
}
$('bScenes').onclick=()=>{renderScenes();$('dScn').showModal()};
$('scSave').onclick=()=>{const name=$('scName').value.trim()||$('scName').placeholder;S.scenes.push({name,data:snap()});save();renderScenes();render();toast(t('tSaved',{n:name}))};
$('scList').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.open!=null){pushUndo();setBoard(JSON.parse(S.scenes[+b.dataset.open].data));sel=null;render();save();$('dScn').close()}
  if(b.dataset.up!=null){const i=+b.dataset.up;[S.scenes[i-1],S.scenes[i]]=[S.scenes[i],S.scenes[i-1]];save();renderScenes()}
  if(b.dataset.over!=null){const s=S.scenes[+b.dataset.over];s.data=snap();save();toast(t('tOver',{n:s.name}))}
  if(b.dataset.del!=null){S.scenes.splice(+b.dataset.del,1);save();renderScenes();render()}
});

/* ---------- file export / import ---------- */
let downloads=null;
if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(d=>{downloads=d}).catch(()=>{})}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`}
$('bExport').onclick=async()=>{
  const data=JSON.stringify({app:'tactics-board',version:1,savedAt:new Date().toISOString(),board:board(),showNames:S.showNames,pitch:{style:S.pitch.style=='photo'?'stripes':S.pitch.style,lines:S.pitch.lines},scenes:S.scenes},null,1);
  const fname=`45tactics_${stamp()}.json`;
  if(!downloads){
    try{const file=new File([data],fname,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'45 Tactics'});return}}
    catch(err){if(err&&err.name=='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return}
  try{await downloads.save({filename:fname,data});toast(t('tExported'))}
  catch(err){const c=err&&err.code;
    if(c=='declined') return;
    if(c=='rate_limited'){toast(t('tWait'));return}
    toast(t('tNoExport'));}
};
$('bImport').onclick=()=>$('fileIn').click();
function validData(o){return o&&o.app==='tactics-board'&&o.board&&Array.isArray(o.board.teams)}
function applyShared(o,replaceAll){
  setBoard(o.board); if(typeof o.showNames==='boolean') S.showNames=o.showNames;
  if(o.pitch&&BG_STYLES.includes(o.pitch.style)&&o.pitch.style!='photo'){S.pitch.style=o.pitch.style;S.pitch.lines=o.pitch.lines!==false;drawPitch()}
  if(replaceAll){S.scenes=(o.scenes||[]).filter(x=>x&&typeof x.data==='string').map(x=>({name:x.name||t('sceneN',{n:1}),data:x.data}));return S.scenes.length}
  const names=new Set(S.scenes.map(x=>x.name));let added=0;
  (o.scenes||[]).forEach(x=>{if(!x||typeof x.data!=='string')return;let n=x.name||t('sceneN',{n:S.scenes.length+1}),k=2,base=n;while(names.has(n))n=`${base} (${k++})`;names.add(n);S.scenes.push({name:n,data:x.data});added++});
  return added;
}
$('fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const o=JSON.parse(await f.text());
    if(!validData(o)) throw 0;
    pushUndo(); const n=applyShared(o,false);
    sel=null; render(); save(); renderScenes();
    toast(n?t('tImported',{n}):t('tLoaded'));
  }catch(err){toast(t('tBadFile'))}
});

/* ---------- shared default (default.json next to index.html) ---------- */
let sharedDefault=null;
if(location.protocol.startsWith('http')){
  fetch('default.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{
    if(!validData(o)) return; sharedDefault=o; $('bDefault').hidden=false;
    if(firstLaunch){applyShared(o,true);sel=null;render();save()}
  }).catch(()=>{});
}
$('bDefault').onclick=()=>{if(!sharedDefault)return;pushUndo();const n=applyShared(sharedDefault,false);sel=null;render();save();renderScenes();toast(t('tDefault',{n}))};

/* ---------- playback ---------- */
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function angLerp(a,b,k){let d=((b-a)%360+540)%360-180;return a+d*k}
function frameBetween(A,B,k){
  const o=clone(B); o.drawings=[];
  o.teams.forEach((tm,ti)=>tm.players.forEach((p,i)=>{const q=A.teams[ti]&&A.teams[ti].players[i];if(!q)return;
    p.x=q.x+(p.x-q.x)*k;p.y=q.y+(p.y-q.y)*k;p.a=angLerp(q.a,p.a,k)}));
  o.ball.x=A.ball.x+(B.ball.x-A.ball.x)*k; o.ball.y=A.ball.y+(B.ball.y-A.ball.y)*k;
  return o;
}
function startPlay(restart){
  if(S.scenes.length<2) return;
  if(restart!==true) pushUndo(); sel=null;
  play={list:S.scenes.map(s=>JSON.parse(s.data)),idx:0,phase:'hold',t0:performance.now(),speed:play?play.speed:1,raf:0,done:false};
  document.body.classList.add('playing'); $('playBar').hidden=false; $('insp').hidden=true; $('penBar').hidden=true;
  setBoard(play.list[0]); render(); updPlayLabel(); play.raf=requestAnimationFrame(tick);
}
function updPlayLabel(){$('pLabel').textContent=`${play.idx+1} / ${play.list.length}`;$('pSpeed').textContent=t('speed',{s:play.speed})}
function tick(now){
  if(!play||play.done) return;
  const HOLD=1300/play.speed, MOVE=1500/play.speed, el=now-play.t0;
  if(play.phase=='hold'){
    if(el>=HOLD){ if(play.idx>=play.list.length-1){play.done=true;$('pRestart').textContent=t('again');return}
      play.phase='move'; play.t0=now; }
  }else{
    const k=Math.min(1,el/MOVE), A=play.list[play.idx], B=play.list[play.idx+1];
    setBoard(frameBetween(A,B,ease(k))); render();
    if(k>=1){play.idx++; setBoard(B); render(); updPlayLabel(); play.phase='hold'; play.t0=now;}
  }
  play.raf=requestAnimationFrame(tick);
}
function stopPlay(){if(!play)return;cancelAnimationFrame(play.raf);play=null;document.body.classList.remove('playing');$('playBar').hidden=true;$('pRestart').textContent=t('restart');$('penBar').hidden=mode!='pen';render();save()}
$('bPlay').onclick=()=>startPlay();
$('pStop').onclick=stopPlay;
$('pRestart').onclick=()=>{const sp=play?play.speed:1;cancelAnimationFrame(play.raf);play={speed:sp};$('pRestart').textContent=t('restart');startPlay(true)};
$('pSpeed').onclick=()=>{const s=[.5,1,2],i=s.indexOf(play.speed);play.speed=s[(i+1)%3];updPlayLabel()};

/* ---------- about & links ---------- */
function setLinks(){
  [['aGuide',GUIDE_URL,'guide'],['aSupport',SUPPORT_URL,'support']].forEach(([id,url,k])=>{const el=$(id);
    if(url){el.href=url;el.removeAttribute('aria-disabled');el.style.opacity='';el.textContent=t(k)}
    else{el.removeAttribute('href');el.setAttribute('aria-disabled','true');el.style.opacity='.45';el.textContent=t(k)+t('soon')}});
}
$('bAbout').onclick=()=>$('dAbout').showModal();
$('langA').addEventListener('change',e=>setLang(e.target.value));

/* ---------- lock & fullscreen ---------- */
let holdT=0, justUnlocked=false;
function setLock(v){locked=v;document.body.classList.toggle('locked',v);$('bLock').setAttribute('aria-pressed',v);
  $('lockTxt').textContent=v?t('locked'):t('lock');
  document.querySelectorAll('dialog[open]').forEach(d=>d.close());
  if(v) toast(t('tLocked'));}
const lb=$('bLock');
lb.addEventListener('click',()=>{if(justUnlocked){justUnlocked=false;return}if(!locked)setLock(true)});
lb.addEventListener('pointerdown',()=>{if(!locked)return;lb.classList.add('holding');holdT=setTimeout(()=>{lb.classList.remove('holding');justUnlocked=true;setLock(false);toast(t('tUnlocked'))},800)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>lb.addEventListener(ev,()=>{clearTimeout(holdT);lb.classList.remove('holding')}));
lb.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('beforeunload',e=>{if(locked){e.preventDefault();e.returnValue=''}});
const de=document.documentElement;
const fsOK=document.fullscreenEnabled||document.webkitFullscreenEnabled;
const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function updFullLabel(){$('bFull').textContent=isFull()?t('exitFull'):t('full')}
if(fsOK&&!standalone){$('bFull').hidden=false;
  $('bFull').onclick=()=>{if(isFull()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}};
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,updFullLabel));}

document.querySelectorAll('dialog').forEach(d=>{
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-close]'))d.close()});
});
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

applyStatic(); drawPitch(); layout(); render();
</script>
</body>
